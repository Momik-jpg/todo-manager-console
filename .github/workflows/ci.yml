name: CI

on:
  push:
    branches: [main, fix/recover-corrupt-todo-file-v2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/TodoManagerConsole.Tests/TodoManagerConsole.Tests.csproj --configuration Release
